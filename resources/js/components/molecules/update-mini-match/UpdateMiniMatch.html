<Teleport to="body">
    <Transition name="modal">
        <div v-if="isOpen && !showRefereeScreen"
             class="fixed inset-0 bg-black backdrop-blur-[1px] bg-opacity-50 flex items-center justify-center z-50 p-3 sm:p-4"
             @click.self="closeModal">
            <div class="bg-white dark:bg-[#161F33] rounded-lg shadow-xl w-full max-w-4xl h-[95vh] sm:h-[85vh] max-h-[95vh] flex flex-col border border-gray-100 dark:border-slate-800 overflow-hidden">
                <div class="flex items-start justify-between p-4 sm:p-6 border-b min-w-0 border-gray-200 dark:border-slate-800 flex-shrink-0">
                    <h2 class="text-lg sm:text-2xl font-semibold text-gray-800 dark:text-slate-100 break-words whitespace-normal max-w-full min-w-0 pr-2">{{ data.name || 'Trận đấu' }}</h2>
                    <button @click="closeModal" class="text-gray-400 dark:text-slate-400 hover:text-gray-600 dark:hover:text-white transition-colors flex-shrink-0">
                        <XMarkIcon class="w-5 h-5 sm:w-6 sm:h-6" />
                    </button>
                </div>
                <div class="p-4 sm:p-6 overflow-y-auto flex-1">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6">
                    <div class="space-y-3 sm:space-y-4">
                            <div v-if="data.scheduled_at" class="flex items-center gap-2 text-sm sm:text-base text-gray-700 dark:text-slate-300 mb-1">
                                <CalendarDaysIcon class="w-4 h-4 sm:w-5 sm:h-5 text-gray-500 dark:text-slate-400 flex-shrink-0" />
                                <span class="break-words">{{ formatEventDate(data.scheduled_at) }}</span>
                            </div>

                            <div class="flex items-center gap-2 text-sm sm:text-base text-gray-700 dark:text-slate-300">
                                <MapPinIcon class="w-4 h-4 sm:w-5 sm:h-5 text-gray-500 dark:text-slate-400 flex-shrink-0" />
                                <span class="break-words">{{ data.competition_location?.name }}</span>
                            </div>

                            <div v-if="availableCourts.length > 0" class="flex items-center gap-2">
                                <label class="text-xs sm:text-sm font-medium text-gray-700 dark:text-slate-300">Sân:</label>
                                <input v-model.number="courtNumber" type="number" min="1" :max="availableCourts.length" placeholder="Nhập số"
                                       class="px-2 py-1 border rounded text-xs sm:text-sm w-16 sm:w-20 dark:bg-slate-700 dark:border-slate-600 dark:text-slate-100"/>
                            </div>

                            <div>
                                <p class="text-xs sm:text-sm text-gray-600 dark:text-slate-400 mb-2 sm:mb-3">
                                    Kết quả kèo đấu được ghi nhận khi tất cả người chơi đã quét mã QR
                                </p>
                                <div class="w-full h-auto p-2 sm:p-3 rounded-lg flex items-center justify-center bg-white dark:bg-white rounded-xl shadow-inner">
                                    <qrcode-vue :value="qrCodeUrl" :size="200" level="H" class="w-full max-w-[200px] sm:max-w-[250px]" />
                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="block text-xs sm:text-sm font-semibold text-gray-700 dark:text-slate-300 mb-2 sm:mb-3">Chọn đội</div>
                            <div class="grid grid-cols-[1.5fr_auto_1.5fr] sm:grid-cols-[2fr_1fr_2fr] gap-2 sm:gap-4 items-stretch mb-4 sm:mb-6">
                                <div
                                    class="border border-1 border-[#DCDEE6] dark:border-slate-700/60 bg-[#F2F7FC] dark:bg-[#1E293B] rounded-lg p-2 sm:p-3 flex flex-col min-w-0">
                                    <p class="text-center mb-2 sm:mb-4 break-words whitespace-normal leading-snug max-w-full font-semibold text-xs sm:text-sm text-gray-800 dark:text-slate-200">{{ data.team1?.name || 'Team 1' }}</p>
                                    <div class="flex gap-1 sm:gap-2 justify-around items-stretch flex-wrap">
                                        <div v-for="user in team1Users" :key="user.id" class="relative">
                                            <UserCard
                                                :showHoverDelete="false"
                                                :name="user.full_name"
                                                :avatar="user.avatar_url"
                                                :size="10"
                                                :badgeSize="4"
                                                class="cursor-pointer"
                                            />
                                            <button
                                                v-if="canManageMatches"
                                                type="button"
                                                class="absolute -top-1 -right-1 w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-white dark:bg-slate-700 border border-gray-200 dark:border-slate-600 shadow flex items-center justify-center text-gray-500 dark:text-slate-300 hover:text-red-600 hover:border-red-200"
                                                title="Xóa khỏi đội"
                                                @click.stop="removeMemberFromTeam('team1', user.id)"
                                            >
                                                <XMarkIcon class="w-3 h-3 sm:w-3.5 sm:h-3.5" />
                                            </button>
                                        </div>
                                        <UserCard v-for="n in emptySlots('team1')" :key="'empty-home-' + n" empty
                                                  :size="10" :badgeSize="4" class="cursor-pointer" />
                                    </div>
                                </div>

                                <div class="flex justify-center items-center px-1">
                                    <span class="text-xs sm:text-sm font-bold text-gray-700 dark:text-slate-300">VS</span>
                                </div>

                                <div
                                    class="border border-1 border-[#DCDEE6] dark:border-slate-700/60 bg-[#F2F7FC] dark:bg-[#1E293B] rounded-lg p-2 sm:p-3 flex flex-col min-w-0">
                                    <p class="text-center mb-2 sm:mb-4 break-words whitespace-normal leading-snug max-w-full font-semibold text-xs sm:text-sm text-gray-800 dark:text-slate-200">{{ data.team2?.name || 'Team 2' }}</p>
                                    <div class="flex gap-1 sm:gap-2 justify-around items-stretch flex-wrap">
                                        <div v-for="user in team2Users" :key="user.id" class="relative">
                                            <UserCard
                                                :showHoverDelete="false"
                                                :name="user.full_name"
                                                :avatar="user.avatar_url"
                                                :size="10"
                                                :badgeSize="4"
                                                class="cursor-pointer"
                                            />
                                            <button
                                                v-if="canManageMatches"
                                                type="button"
                                                class="absolute -top-1 -right-1 w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-white dark:bg-slate-700 border border-gray-200 dark:border-slate-600 shadow flex items-center justify-center text-gray-500 dark:text-slate-300 hover:text-red-600 hover:border-red-200"
                                                title="Xóa khỏi đội"
                                                @click.stop="removeMemberFromTeam('team2', user.id)"
                                            >
                                                <XMarkIcon class="w-3 h-3 sm:w-3.5 sm:h-3.5" />
                                            </button>
                                        </div>
                                        <UserCard v-for="n in emptySlots('team2')" :key="'empty-away-' + n" empty
                                                  :size="10" :badgeSize="4" class="cursor-pointer" />
                                    </div>
                                </div>
                            </div>

                            <MatchScoreInput
                                v-model="scores"
                                :can-edit="canManageMatches"
                                @open-referee="openRefereeScreen"
                            />
                        </div>
                    </div>
                </div>

                <div class="px-3 sm:px-4 py-3 sm:py-4 bg-white dark:bg-[#161F33] rounded-b-lg border-t border-gray-200 dark:border-slate-800 flex-shrink-0">
                    <div class="flex flex-col sm:flex-row gap-2 sm:gap-3">
                        <button v-if="canManageMatches" @click="saveMiniMatch" :disabled="isSaving"
                                class="w-full sm:w-auto px-6 sm:px-12 py-2.5 sm:py-3 bg-red-500 text-white rounded font-medium hover:bg-red-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed text-sm sm:text-base">
                            {{ isSaving ? 'Đang lưu...' : 'Lưu' }}
                        </button>
                        <button v-if="canManageMatches" @click="confirmMiniMatchResult"
                                :disabled="isSaving || currentMiniMatch.status === 'completed'"
                                class="w-full sm:w-auto flex items-center justify-center gap-2 px-6 sm:px-12 py-2.5 sm:py-3 bg-green-500 text-white rounded font-medium hover:bg-green-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed text-sm sm:text-base">
                            <template v-if="currentMiniMatch.status === 'completed'">
                                <CheckBadgeIcon class="w-5 h-5 sm:w-6 sm:h-6 text-white" />
                                <span>Đã xác nhận</span>
                            </template>
                            <template v-else>
                                {{ isSaving ? 'Đang xác nhận...' : 'Xác nhận' }}
                            </template>
                        </button>
                        <button @click="closeModal" :disabled="isSaving"
                                class="w-full sm:w-auto px-6 sm:px-12 py-2.5 sm:py-3 bg-gray-200 dark:bg-slate-700 text-gray-700 dark:text-slate-200 hover:bg-gray-300 dark:hover:bg-slate-600 font-medium rounded transition-colors disabled:opacity-50 text-sm sm:text-base">
                            Hủy
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </Transition>
</Teleport>

<RefereeScoringScreen
    v-if="showRefereeScreen"
    :team1="team1ForReferee"
    :team2="team2ForReferee"
    :miniTournament="miniTournament"
    :initialScores="scores"
    @done="onRefereeDone"
    @back="onRefereeBack"
/>
